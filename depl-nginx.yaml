apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-wait
  labels:
    app: nginx-wait
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-wait
  template:
    metadata:
      labels:
        app: nginx-wait
    spec:
      initContainers:
      - name: wait-for-service
        image: busybox:1.36       
        command:
        - sh
        - -c
        - |
          until nslookup nginx-wait-svc.default.svc.cluster.local > /dev/null 2>&1
          do
            sleep 2
          done
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
      
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"